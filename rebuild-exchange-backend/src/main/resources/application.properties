# ==============================================================================
# ReBuild Exchange - Spring Boot Application Configuration
# ==============================================================================
spring.application.name=rebuild-exchange-backend
server.port=8080

# ------------------------------------------------------------------------------
# MySQL 8 Database Configuration
# ------------------------------------------------------------------------------
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:rebuild_exchange}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:Pes@22020}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hikari Connection Pool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000

# ------------------------------------------------------------------------------
# JPA & Hibernate Configuration
# ------------------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# ------------------------------------------------------------------------------
# Flyway Database Migration
# ------------------------------------------------------------------------------
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# ------------------------------------------------------------------------------
# JWT Authentication Configuration
# ------------------------------------------------------------------------------
app.jwt.secret=${JWT_SECRET:4c81a28723c0dc89ef48b671d1796d8e8bfa6939e6a394f4a3be9e4df1cf45bf}
app.jwt.expiration-milliseconds=86400000
app.jwt.refresh-expiration-milliseconds=604800000

# ------------------------------------------------------------------------------
# Email OTP Configuration (Two-step verification)
# ------------------------------------------------------------------------------
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:no-reply@rebuild.exchange}
spring.mail.password=${MAIL_PASSWORD:emailappsecret}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.otp.expiration-minutes=10
app.otp.max-attempts=5
app.otp.resend-cooldown-seconds=60

# ------------------------------------------------------------------------------
# File Upload Configuration
# ------------------------------------------------------------------------------
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=20MB
app.upload.dir=./uploads

# ------------------------------------------------------------------------------
# Razorpay Payment Gateway (Test / Sandbox Mode)
# ------------------------------------------------------------------------------
app.razorpay.key-id=${RAZORPAY_KEY_ID:rzp_test_placeholder_key}
app.razorpay.key-secret=${RAZORPAY_KEY_SECRET:placeholder_secret}
app.razorpay.webhook-secret=${RAZORPAY_WEBHOOK_SECRET:placeholder_webhook_secret}

# ------------------------------------------------------------------------------
# Google Gemini AI Chatbot
# ------------------------------------------------------------------------------
app.gemini.api-key=${GEMINI_API_KEY:}
app.gemini.model=gemini-2.5-flash

# ------------------------------------------------------------------------------
# Actuator & Swagger Endpoints
# ------------------------------------------------------------------------------
management.endpoints.web.exposure.include=health,info,metrics
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
